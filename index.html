<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 25px;
      animation: flutuar 3s ease-in-out infinite;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .status {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 50px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 14px;
      color: #e2e8f0;
    }

    @keyframes flutuar {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">⚠️</div>

    <h1>Site desativado</h1>

    <p>
      O site foi desativado permanentemente devido a infrações cometidas. Pedimos desculpas pelo erro e não iremos mais cometer esse erro.
    </p>

    <div class="status">
      O site será desativado completamente em 20/09/2026, ás 09:00
    </div>

  </div>

</body>
</html>
